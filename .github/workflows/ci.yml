# MandiCast CI (docs/15 §5). Actions are pinned to commit SHAs; the workflow can only read the repository.
# Not run here: the dashboard's Playwright tests, which need the full price database (run them locally with
# `npm run test:e2e`, or against the Compose stack with E2E_BASE_URL=http://localhost:8090).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest on PostgreSQL + Redis, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Same image as docker-compose.yml. Throwaway database reachable only from this job, so it uses trust
        # authentication instead of a password written into this file.
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_USER: mandicast
          POSTGRES_DB: mandicast
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mandicast -d mandicast"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://mandicast@127.0.0.1:5432/mandicast
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-linux.lock.txt
      - name: Install locked dependencies (hash-checked)
        run: python -m pip install --no-deps --require-hashes -r requirements-linux.lock.txt
      - name: Create the test database
        run: psql -h 127.0.0.1 -U mandicast -d mandicast -c "CREATE DATABASE mandicast_test"
      - name: Lint
        run: python -m ruff check --no-cache src tests scripts migrations
      - name: Tests
        run: python -m pytest -p no:cacheprovider
      - name: Known vulnerabilities in Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-linux.lock.txt --require-hashes --disable-pip --progress-spinner off

  dashboard:
    name: Dashboard (typecheck, lint, tests, build, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities in npm dependencies
        run: npm audit --audit-level=high

  images:
    name: Images and a fresh deployment (Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Generate a throwaway .env (random values, never stored)
        run: |
          {
            echo "POSTGRES_USER=mandicast"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "API_DB_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          mkdir -p data models reports logs
          sudo chown -R 10001 data models reports logs experiments
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build api dashboard
      - name: Start db, redis, migrations, API and dashboard on an empty database
        run: |
          docker compose up -d db redis api dashboard
          for i in $(seq 1 60); do
            [ "$(docker compose ps dashboard --format '{{.Health}}')" = healthy ] && break
            sleep 3
          done
          docker compose ps -a
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
      - name: Smoke test through the dashboard's web server
        run: |
          curl -fsS http://127.0.0.1:8090/v1/health
          curl -fsS http://127.0.0.1:8090/v1/commodities
          curl -fsS -D - -o /dev/null http://127.0.0.1:8090/ | grep -i "content-security-policy: .*frame-ancestors 'none'"
          ! curl -fsS --max-time 3 http://127.0.0.1:8000/v1/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
