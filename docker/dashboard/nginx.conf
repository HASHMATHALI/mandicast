# Dashboard + API on one origin. Only this server is published; the API is reachable only through /v1 here, so the
# API may trust X-Forwarded-For (API_TRUST_FORWARDED_FOR=true): this proxy overwrites it with the real client address.
server_tokens off;

# Per-address request limit in front of the API's own limit (bursts from one client never reach uvicorn).
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16k;

    location /v1/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # The API sets its own security headers, caching rules and errors.
    }

    # Hashed build files never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
